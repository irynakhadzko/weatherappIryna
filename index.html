    .header-divider {

      width: 80px;
      height: 4px;
      border-radius: 2px;
      background: linear-gradient(90deg, #f59e0b, #fde68a);
    }

    /* ── LEGEND ── */

      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px 20px;
      max-width: 780px;
      margin: 36px auto 0;
      padding: 0 20px;
      font-size: .82rem;
      color: #7a5c0a;
    }
    .legend span { white-space: nowrap; }

    /* ── GRID ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 22px;
      max-width: 1300px;
      margin: 40px auto 60px;
      padding: 0 20px;
    }

    /* ── CARD ── */
    .card {
      background: #ffffff;
      border-radius: 18px;
      border: 1.5px solid #fde68a;
      box-shadow: 0 4px 18px rgba(245,158,11,.13);
      overflow: hidden;
      transition: transform .18s, box-shadow .18s;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 28px rgba(245,158,11,.22);
    }
    .card-header {
      background: linear-gradient(90deg, #fef3c7, #fffbeb);
      padding: 13px 18px 11px;
      border-bottom: 1px solid #fde68a;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .card-flag { font-size: 1.7rem; line-height: 1; }
    .card-country {
      font-weight: 700;
      font-size: 1.05rem;
      color: #92400e;
    }

    /* ── TABLE ── */
    table { width: 100%; border-collapse: collapse; }
    thead th {
      font-size: .72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: #a16207;
      background: #fffbeb;
      padding: 8px 14px;
    }
    thead th:first-child { text-align: left; }
    thead th:not(:first-child) { text-align: center; }
    tbody tr { border-top: 1px solid #fef3c7; }
    tbody tr:hover { background: #fffdf0; }
    td { padding: 9px 14px; font-size: .88rem; }
    td.city-name { font-weight: 500; color: #44301a; }
    td.weather-cell { text-align: center; }
    .w-emoji { font-size: 1.25rem; display: block; line-height: 1; }
    .w-temp  { font-size: .78rem; font-weight: 700; color: #b45309; margin-top: 2px; }
    .w-desc  { font-size: .68rem; color: #92400e; margin-top: 1px; }

    /* ── FOOTER ── */
    footer {
      text-align: center;
      padding: 22px 20px 36px;
      font-size: .78rem;
      color: #a16207;
    }
  </style>
</head>
